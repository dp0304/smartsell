map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# The scheme the browser used: the deployment TLS proxy says so, else this listener's own.
map $http_x_forwarded_proto $smartsell_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Resolve again after a Compose recreate changes the server container address.
resolver 127.0.0.11 valid=5s ipv6=off;
server_tokens off;
client_max_body_size 32m;

# S2: the deployment TLS proxy reaches this container from a private address (Compose publishes the ports on loopback
# only), so take the browser's address from the X-Forwarded-For it adds; web-proxy.conf hands that one address to the API.
# A client on the internet never connects from these ranges, so it cannot pick its own address. If the TLS proxy runs
# elsewhere on a public address, add a set_real_ip_from line for exactly that address.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# S8: the same headers the hub sends (apps/server/src/hub/web-static.ts WEB_CSP, app.ts). The public and portal pages
# also carry their own, stricter CSP meta tags; browsers apply both. TLS terminates upstream, so HSTS reaches the browser
# over HTTPS. No location below has its own add_header, so every response gets these.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

server {
    listen 8080;
    root /srv/web;
    set $api server:3401;

    location ~ ^/(?:api(?:/|$)|mcp(?:/|$)|oauth(?:/|$)|\.well-known/|r/|healthz$|readyz$) {
        include /etc/nginx/web-proxy.conf;
    }
    location ~ ^/(?:landing/[^/]+|unsubscribe)/?$ {
        root /srv/public;
        try_files /index.html =404;
    }
    location ~ ^/assets/(?:app\.js|styles\.css|traffic\.css)$ {
        root /srv/public;
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}

server {
    listen 8081;
    root /srv/portal;
    set $api server:3401;

    location ^~ /api/v1/portal/ {
        include /etc/nginx/web-proxy.conf;
    }
    # The Commands session guard trusts only the workbench origin. Translate
    # the default HTTPS portal origin solely for these credential-free endpoints.
    # TLS terminates upstream, which must preserve the external Host authority.
    location ~ ^/api/portal/(?:share|creator-submit)$ {
        if ($request_method != POST) { return 405; }
        set $portal_host_origin https://$http_host;
        if ($portal_host_origin != '${PORTAL_ORIGIN}') { return 403; }
        if ($http_origin != '${PORTAL_ORIGIN}') { return 403; }
        proxy_set_header Origin '${PUBLIC_ORIGIN}';
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        include /etc/nginx/web-proxy.conf;
    }
    location ~ ^/(?:share|creator)/?$ { try_files /collaboration.html =404; }
    location ~ ^/(?:s|invite)/[a-fA-F0-9-]+/?$ { try_files /index.html =404; }
    location ~ ^/(?:src/(?:main|api|i18n)\.js|src/styles\.css|assets/(?:app\.js|styles\.css))$ { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location / { return 404; }
}
