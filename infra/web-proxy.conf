proxy_pass http://$api;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# S2: one clean client address for the API, which trusts this hop through TRUST_PROXY=1. $remote_addr is the browser:
# web.conf takes it from the deployment TLS proxy's X-Forwarded-For (real_ip). Whatever the browser sent is dropped.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $smartsell_forwarded_proto;
# S8: web.conf adds these for every response; drop the API's copies so each header is sent once.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_buffering off;
proxy_read_timeout 300s;
