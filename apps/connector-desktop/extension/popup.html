<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>SmartSell Worker</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --ok: #1a7f37; --warn: #b35900; --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --ok: #3fb950; --warn: #f0883e; --bg: #1c1c1e; } }
  body { margin: 0; padding: 14px 16px; width: 300px; font: 13px/1.5 -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>SmartSell Worker</h1>
<p id="state" class="muted">讀取中…</p>
<p id="files" class="warn" hidden>還沒開啟「允許存取檔案網址」，上傳影片會失敗。請在這個擴充功能的「詳細資料」開啟它。</p>
<p class="muted">只操作 SmartSell 自己開的分頁（在名為 SmartSell 的視窗裡）。Worker 操作時，Chrome 頂端會顯示「已開始對這個瀏覽器進行偵錯」；按「取消」會中斷那一則。</p>
<script src="popup.js"></script>
</body>
</html>
