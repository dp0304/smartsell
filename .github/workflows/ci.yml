name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    # pnpm verify → pnpm test --built-web also runs tests/e2e-phase1 (E28) and the own-Chrome suites (E49/E50); the job took
    # about 50 minutes on 2026-11-26. tests/e2e-phase1 alone is about 12 minutes of wall time, sharing
    # at most 4 node:test slots with every other node test file, after the build.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Playwright's Chromium serves the Playwright specs (scripts/playwright-browser.mjs picks it).
      - run: pnpm exec playwright install --with-deps chromium
      # tests/e2e-phase1 generates the §10.2 clip with ffmpeg (tests/e2e-phase1/video.ts) and the hub probes uploads with ffprobe.
      - run: sudo apt-get install -y ffmpeg
      # The headless Workers (E2E stacks, worker/loop.test.ts, tests/connector-desktop) launch Google Chrome themselves, without
      # --no-sandbox. On ubuntu-24.04 only the image's Google Chrome (/opt/google/chrome, covered by the image's AppArmor
      # profile) has a usable sandbox; Playwright's Chromium under ~/.cache would stop with "No usable sandbox!". Pin the
      # Workers to the runner's Chrome and fail here, instead of letting every Chrome test skip, if the image ever drops it.
      - name: Point the headless Workers at the runner's Google Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || true)"
          if [ -z "$chrome" ]; then
            echo "::error::Google Chrome is not installed on this runner; the headless Worker tests and tests/e2e-phase1 cannot run."
            exit 1
          fi
          "$chrome" --version
          echo "SMARTSELL_CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - run: pnpm verify

  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg
      - run: pnpm verify:services integration

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:services recovery

  desktop-package:
    name: Desktop development package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: windows-2025
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/connector-desktop/node_modules/electron/install.js
      - run: pnpm --filter @smartsell/connector-desktop build
      - run: pnpm exec node apps/connector-desktop/scripts/package.mjs ${{ matrix.target }} --local-dir
      - run: node scripts/verify-desktop-package.mjs
      - name: Verify the macOS development signature
        if: matrix.target == 'mac'
        shell: bash
        run: codesign --verify --deep --strict apps/connector-desktop/release-local/mac*/'SmartSell Worker.app'
